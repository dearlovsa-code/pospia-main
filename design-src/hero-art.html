<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 2560px; height: 1440px; overflow: hidden; background: #141311; }
  .scene { position: absolute; inset: 0; display: none; }
  .scene.on { display: block; }
  svg { position: absolute; inset: 0; width: 2560px; height: 1440px; }
  .grain { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>"); }
</style></head>
<body>

<!-- ============ 1. Line constellation: devices drawn in fine gold/white lines ============ -->
<div class="scene" id="s1">
<svg viewBox="0 0 2560 1440">
  <defs>
    <radialGradient id="g1" cx="66%" cy="48%" r="55%"><stop offset="0" stop-color="#2f4152" stop-opacity=".9"/><stop offset=".55" stop-color="#1f2328" stop-opacity=".6"/><stop offset="1" stop-color="#141311" stop-opacity="0"/></radialGradient>
    <radialGradient id="g1b" cx="74%" cy="30%" r="22%"><stop offset="0" stop-color="#d6cd94" stop-opacity=".16"/><stop offset="1" stop-color="#d6cd94" stop-opacity="0"/></radialGradient>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f2ed" stop-opacity=".9"/><stop offset="1" stop-color="#d6cd94" stop-opacity=".9"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#496175" stop-opacity=".35"/><stop offset="1" stop-color="#2f4152" stop-opacity=".05"/></linearGradient>
  </defs>
  <rect width="2560" height="1440" fill="#141311"/>
  <rect width="2560" height="1440" fill="url(#g1)"/>
  <rect width="2560" height="1440" fill="url(#g1b)"/>
<g transform="translate(450 130) scale(.82)">
  <!-- orbit rings -->
  <g fill="none" stroke="#f4f2ed" stroke-opacity=".14" stroke-width="1.5">
    <ellipse cx="1690" cy="760" rx="820" ry="300" transform="rotate(-12 1690 760)"/>
    <ellipse cx="1690" cy="760" rx="560" ry="560"/>
    <ellipse cx="1690" cy="760" rx="980" ry="420" transform="rotate(8 1690 760)" stroke-opacity=".07"/>
  </g>
  <g fill="#d6cd94"><circle cx="2492" cy="590" r="7"/><circle cx="1130" cy="1060" r="4"/><circle cx="1690" cy="200" r="5"/><circle cx="2230" cy="1172" r="3"/></g>
  <!-- kiosk (tall) -->
  <g fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="1560" y="250" width="300" height="640" rx="34"/>
    <rect x="1590" y="290" width="240" height="420" rx="14" fill="url(#scr)"/>
    <g stroke-width="2" stroke-opacity=".7"><rect x="1612" y="318" width="60" height="60" rx="8"/><rect x="1680" y="318" width="60" height="60" rx="8"/><rect x="1748" y="318" width="60" height="60" rx="8"/>
      <rect x="1612" y="388" width="60" height="60" rx="8"/><rect x="1680" y="388" width="60" height="60" rx="8"/><rect x="1748" y="388" width="60" height="60" rx="8"/>
      <rect x="1612" y="458" width="60" height="60" rx="8"/><rect x="1680" y="458" width="60" height="60" rx="8"/><rect x="1748" y="458" width="60" height="60" rx="8"/>
      <path d="M1612 560h196M1612 594h150M1612 628h120"/><rect x="1612" y="652" width="196" height="40" rx="20" stroke="#d6cd94"/></g>
    <path d="M1660 760h100M1640 800h140"/><rect x="1670" y="830" width="80" height="22" rx="6"/>
    <path d="M1650 890l-30 270M1770 890l30 270M1580 1160h260"/>
  </g>
  <!-- POS (front, left of kiosk) -->
  <g fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="1050" y="560" width="420" height="290" rx="22"/>
    <rect x="1074" y="584" width="372" height="242" rx="10" fill="url(#scr)"/>
    <g stroke-width="2" stroke-opacity=".7"><path d="M1098 612h170M1098 644h120"/><rect x="1098" y="672" width="94" height="58" rx="8"/><rect x="1202" y="672" width="94" height="58" rx="8"/><rect x="1306" y="672" width="114" height="58" rx="8"/>
      <rect x="1098" y="740" width="94" height="58" rx="8"/><rect x="1202" y="740" width="94" height="58" rx="8"/><rect x="1306" y="740" width="114" height="58" rx="8" stroke="#d6cd94"/></g>
    <path d="M1230 850l-24 130h108l-24-130"/><path d="M1110 980h300l40 70h-380z"/>
  </g>
  <!-- card terminal (front right) -->
  <g fill="none" stroke="url(#ln)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="1980" y="700" width="200" height="350" rx="36"/>
    <rect x="2006" y="730" width="148" height="100" rx="10" fill="url(#scr)"/>
    <g stroke-width="2.4"><circle cx="2030" cy="880" r="12"/><circle cx="2080" cy="880" r="12"/><circle cx="2130" cy="880" r="12"/><circle cx="2030" cy="926" r="12"/><circle cx="2080" cy="926" r="12"/><circle cx="2130" cy="926" r="12"/><circle cx="2030" cy="972" r="12"/><circle cx="2080" cy="972" r="12"/><circle cx="2130" cy="972" r="12" stroke="#d6cd94"/></g>
    <path d="M2010 1050h140v34h-140z" stroke-opacity=".6"/>
    <!-- card -->
    <rect x="2090" y="610" width="230" height="146" rx="16" transform="rotate(-18 2205 683)" stroke="#d6cd94"/>
    <path d="M2110 650l200-64" transform="rotate(0)" stroke="#d6cd94" stroke-opacity=".6"/>
  </g>
  <!-- contactless waves -->
  <g fill="none" stroke="#d6cd94" stroke-opacity=".7" stroke-width="2.4" stroke-linecap="round"><path d="M2230 520a40 40 0 0 1 0 60"/><path d="M2256 500a70 70 0 0 1 0 100"/><path d="M2282 480a100 100 0 0 1 0 140"/></g>
  <!-- floor reflection line -->
  <path d="M900 1180h1700" stroke="#f4f2ed" stroke-opacity=".12" stroke-width="2"/>
</g>
</svg>
<div class="grain"></div>
</div>

<!-- ============ 2. Glass: soft colour light with frosted panels ============ -->
<div class="scene" id="s2">
<svg viewBox="0 0 2560 1440">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="120"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#d6cd94" stop-opacity=".45"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#d6cd94" stop-opacity=".2"/><stop offset="1" stop-color="#d6cd94" stop-opacity=".85"/></linearGradient>
  </defs>
  <rect width="2560" height="1440" fill="#151517"/>
<g transform="translate(450 130) scale(.82)">
  <g filter="url(#blur)">
    <circle cx="1900" cy="520" r="420" fill="#496175" opacity=".85"/>
    <circle cx="1450" cy="980" r="320" fill="#6b5d7a" opacity=".55"/>
    <circle cx="2250" cy="1080" r="300" fill="#d6cd94" opacity=".35"/>
    <circle cx="900" cy="300" r="260" fill="#2f4152" opacity=".5"/>
  </g>
  <!-- back panel: sales chart -->
  <g transform="translate(1180 330) rotate(-6)">
    <rect width="760" height="480" rx="40" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <g fill="#f4f2ed" fill-opacity=".55"><rect x="56" y="56" width="180" height="18" rx="9"/><rect x="56" y="92" width="110" height="14" rx="7" fill-opacity=".3"/></g>
    <g><rect x="80" y="300" width="62" height="120" rx="12" fill="url(#bar)"/><rect x="176" y="250" width="62" height="170" rx="12" fill="url(#bar)"/><rect x="272" y="270" width="62" height="150" rx="12" fill="url(#bar)"/><rect x="368" y="200" width="62" height="220" rx="12" fill="url(#bar)"/><rect x="464" y="160" width="62" height="260" rx="12" fill="url(#bar)"/><rect x="560" y="120" width="62" height="300" rx="12" fill="url(#bar)"/></g>
    <path d="M110 280L206 236L302 252L398 186L494 148L590 104" fill="none" stroke="#f4f2ed" stroke-opacity=".8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#f4f2ed"><circle cx="590" cy="104" r="10"/></g>
  </g>
  <!-- front panel: payment complete -->
  <g transform="translate(1720 690) rotate(4)">
    <rect width="560" height="440" rx="40" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <circle cx="280" cy="150" r="70" fill="none" stroke="#d6cd94" stroke-width="5"/>
    <path d="M248 152l24 24 46-50" fill="none" stroke="#d6cd94" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#f4f2ed"><rect x="150" y="262" width="260" height="22" rx="11" fill-opacity=".7"/><rect x="190" y="304" width="180" height="16" rx="8" fill-opacity=".35"/><rect x="110" y="352" width="340" height="52" rx="26" fill="#d6cd94" fill-opacity=".85"/></g>
  </g>
  <!-- small chip: card -->
  <g transform="translate(1260 900) rotate(-14)">
    <rect width="380" height="240" rx="28" fill="url(#glass)" stroke="url(#edge)" stroke-width="2"/>
    <rect x="40" y="60" width="70" height="52" rx="10" fill="none" stroke="#d6cd94" stroke-width="3"/>
    <g fill="#f4f2ed" fill-opacity=".45"><rect x="40" y="160" width="200" height="16" rx="8"/><rect x="40" y="190" width="120" height="12" rx="6" fill-opacity=".25"/></g>
  </g>
  <g fill="#f4f2ed" fill-opacity=".5"><circle cx="1120" cy="420" r="4"/><circle cx="2380" cy="380" r="5"/><circle cx="2120" cy="1250" r="3"/></g>
</g>
</svg>
<div class="grain"></div>
</div>

<!-- ============ 3. Stage: one kiosk lit on a quiet floor ============ -->
<div class="scene" id="s3">
<svg viewBox="0 0 2560 1440">
  <defs>
    <radialGradient id="spot" cx="66%" cy="10%" r="70%"><stop offset="0" stop-color="#f4f2ed" stop-opacity=".22"/><stop offset=".45" stop-color="#d6cd94" stop-opacity=".06"/><stop offset="1" stop-color="#141311" stop-opacity="0"/></radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#d6cd94" stop-opacity=".28"/><stop offset="1" stop-color="#d6cd94" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a2724"/><stop offset=".5" stop-color="#3a3632"/><stop offset="1" stop-color="#1f1d1b"/></linearGradient>
    <linearGradient id="screen3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b5266"/><stop offset="1" stop-color="#1c2833"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1a18"/><stop offset="1" stop-color="#0f0e0d"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f2ed" stop-opacity=".12"/><stop offset="1" stop-color="#f4f2ed" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="2560" height="1440" fill="#141311"/>
  <rect y="1040" width="2560" height="400" fill="url(#floor)"/>
  <rect width="2560" height="1440" fill="url(#spot)"/>
<g transform="translate(450 130) scale(.82)">
  <path d="M1560 0h300l260 1160h-820z" fill="url(#beam)"/>
  <!-- perspective floor lines -->
  <g stroke="#f4f2ed" stroke-opacity=".07" stroke-width="2">
    <path d="M0 1040h2560"/><path d="M0 1110h2560" stroke-opacity=".05"/><path d="M0 1210h2560" stroke-opacity=".04"/><path d="M0 1350h2560" stroke-opacity=".03"/>
    <path d="M1700 1040L300 1440M1700 1040L1100 1440M1700 1040L1900 1440M1700 1040L2560 1300M1700 1040L0 1180"/>
  </g>
  <ellipse cx="1700" cy="1080" rx="420" ry="70" fill="url(#pool)"/>
  <ellipse cx="1700" cy="1072" rx="190" ry="22" fill="#000" opacity=".55"/>
  <!-- kiosk -->
  <g>
    <rect x="1555" y="300" width="290" height="560" rx="30" fill="url(#body)" stroke="#f4f2ed" stroke-opacity=".18" stroke-width="2"/>
    <rect x="1580" y="330" width="240" height="380" rx="14" fill="url(#screen3)"/>
    <g fill="#f4f2ed" fill-opacity=".14"><rect x="1600" y="352" width="60" height="60" rx="8"/><rect x="1670" y="352" width="60" height="60" rx="8"/><rect x="1740" y="352" width="60" height="60" rx="8"/><rect x="1600" y="422" width="60" height="60" rx="8"/><rect x="1670" y="422" width="60" height="60" rx="8"/><rect x="1740" y="422" width="60" height="60" rx="8"/></g>
    <g fill="#f4f2ed" fill-opacity=".22"><rect x="1600" y="520" width="200" height="14" rx="7"/><rect x="1600" y="548" width="140" height="12" rx="6"/></g>
    <rect x="1600" y="650" width="200" height="40" rx="20" fill="#d6cd94" fill-opacity=".85"/>
    <rect x="1650" y="760" width="100" height="16" rx="8" fill="#000" opacity=".5"/>
    <rect x="1670" y="800" width="60" height="24" rx="6" fill="#000" opacity=".45"/>
    <path d="M1650 860h100l20 210h-140z" fill="url(#body)" stroke="#f4f2ed" stroke-opacity=".12" stroke-width="2"/>
    <rect x="1555" y="300" width="290" height="560" rx="30" fill="none" stroke="#d6cd94" stroke-opacity=".35" stroke-width="2"/>
    <path d="M1590 310h220" stroke="#f4f2ed" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- thin gold rings around -->
  <g fill="none" stroke="#d6cd94" stroke-opacity=".28" stroke-width="2"><ellipse cx="1700" cy="1072" rx="520" ry="92"/><ellipse cx="1700" cy="1072" rx="700" ry="130" stroke-opacity=".14"/></g>
  <g fill="#d6cd94"><circle cx="2220" cy="1072" r="6"/><circle cx="1000" cy="1100" r="4"/></g>
</g>
</svg>
<div class="grain"></div>
</div>

<script>document.getElementById(location.hash.slice(1) || 's1').classList.add('on');</script>
</body></html>
